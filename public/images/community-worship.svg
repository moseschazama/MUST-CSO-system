            <stop offset="0" stop-color="#240811"/>
            <stop offset="0.55" stop-color="#3a0e1c"/>
            <stop offset="1" stop-color="#52172b"/>
        </linearGradient>
        <radialGradient id="worship-glow" cx="0.5" cy="0.55" r="0.6">
